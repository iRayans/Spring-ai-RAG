services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexacorp_knowledge
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # named Docker volume

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"


  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_KEY: "$OPEN_KEY"
      DB_URL: jdbc:postgresql://postgres:5432/nexacorp_knowledge
      DB_USERNAME: nexa
      DB_PASSWORD: nexa
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL_ENABLED: false
    depends_on: # Should start before the app
      - postgres
      - redis
volumes:
  postgres-data: